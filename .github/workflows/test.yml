name: tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "import server; assert server.app is not None"
      - name: MCP smoke test
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8765 > /tmp/upe.log 2>&1 &
          sleep 3
          UPE_MCP_URL=http://127.0.0.1:8765/mcp python smoke.py || (cat /tmp/upe.log && exit 1)
